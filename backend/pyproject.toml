# Tool configuration for the API. Pinned here rather than passed as command
# line flags, so an editor, a local run and CI all apply the same rules.

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import ordering
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit, overlapping with the security workflow
    "C4",   # comprehensions
    "SIM",  # simplifications
]
ignore = [
    # Long lines inside SQL strings are the SQL's own formatting, which is
    # more readable left alone than wrapped to fit.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# S608 flags SQL built with an f-string. In this package that pattern is
# deliberate and narrow: the interpolated parts are column lists, table names
# and sort directions taken from allowlists defined in the module itself, never
# from a request. Every value that originates with a caller is bound as a
# parameter. The rule cannot tell the two apart, so it is disabled here and
# nowhere else — SQL assembled outside the repository layer should still fail
# the check.
"app/repositories/*" = ["S608"]

# Assertions and hard-coded test values are the point of a test file.
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
